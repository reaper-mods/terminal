services:
  - type: web
    name: z-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OFFLINE_AFTER
        value: "45"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
